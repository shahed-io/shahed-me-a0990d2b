    <style>
      #initial-loader{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;padding:24px;background:hsl(240 30% 5%);background-image:radial-gradient(at 20% 20%,hsl(265 90% 65% / .34) 0,transparent 48%),radial-gradient(at 80% 4%,hsl(330 90% 65% / .26) 0,transparent 46%),radial-gradient(at 6% 86%,hsl(195 95% 55% / .24) 0,transparent 48%);color:hsl(0 0% 98%);font-family:'Inter',system-ui,sans-serif;transition:opacity .32s ease,visibility .32s ease}
      #initial-loader.hide{opacity:0;visibility:hidden;pointer-events:none}
      #initial-loader .shell{width:min(880px,100%);display:flex;flex-direction:column;gap:28px}
      #initial-loader .head{display:flex;align-items:center;justify-content:space-between;gap:18px}
      #initial-loader .brand{font-family:'Space Grotesk',Inter,system-ui,sans-serif;font-size:clamp(26px,5vw,46px);font-weight:700;letter-spacing:0;line-height:1;background:linear-gradient(135deg,hsl(265 90% 75%),hsl(195 95% 62%));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
      #initial-loader .status{font-size:12px;color:hsl(240 8% 78%);white-space:nowrap}
      #initial-loader .hero{display:grid;gap:14px}
      #initial-loader .line,#initial-loader .card,#initial-loader .pill{position:relative;overflow:hidden;background:hsl(240 28% 14% / .72);border:1px solid hsl(0 0% 100% / .08);box-shadow:0 8px 32px hsl(240 50% 2% / .25)}
      #initial-loader .line{height:clamp(48px,8vw,74px);width:min(680px,100%);border-radius:9999px}
      #initial-loader .pill{height:12px;border-radius:9999px}
      #initial-loader .pill.one{width:min(560px,84%)}#initial-loader .pill.two{width:min(440px,66%)}
      #initial-loader .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
      #initial-loader .card{height:112px;border-radius:12px}
      #initial-loader .line::after,#initial-loader .card::after,#initial-loader .pill::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,hsl(0 0% 100% / .16),transparent);animation:il-shimmer 1.35s ease-in-out infinite}
      #initial-loader .progress{height:3px;border-radius:9999px;background:hsl(265 30% 18% / .7);overflow:hidden}
      #initial-loader .progress::after{content:"";display:block;height:100%;width:42%;border-radius:9999px;background:linear-gradient(135deg,hsl(265 90% 65%),hsl(195 95% 55%));animation:il-progress 1.05s ease-in-out infinite}
      @keyframes il-shimmer{100%{transform:translateX(100%)}}
      @keyframes il-progress{0%{transform:translateX(-110%)}100%{transform:translateX(240%)}}
      @media(max-width:640px){#initial-loader .cards{grid-template-columns:1fr}#initial-loader .card{height:82px}#initial-loader .status{display:none}}
      @media(prefers-reduced-motion:reduce){#initial-loader *{animation:none!important}}
    </style>

    <script>
      (function(){
        var hide=function(){var el=document.getElementById('initial-loader');if(!el)return;el.classList.add('hide');setTimeout(function(){el&&el.remove();},500);};
        if(document.readyState==='complete'){requestAnimationFrame(hide);}
        else{window.addEventListener('load',function(){requestAnimationFrame(hide);},{once:true});}
        setTimeout(hide,4000);
      })();
    </script>
